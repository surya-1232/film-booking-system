<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SunLight PlayHouse</title>
    <link rel="stylesheet" href="#" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" href="#" th:href="@{/css/all.css}">
    <link rel="stylesheet" href="#" th:href="@{/css/index.css}">
</head>
<body>
	
	<!--  FOR ADMIN PURPOSE ONLY-->

	<header class="bg-dark text-light p-3">
        <h2 class="text-center text-2xl font-bold">SunLight PlayHouse - Admin Panel</h2>
    </header>


	<nav class="bg-secondary p-2 text-center">
        <a th:href="@{/admin/home}" class="text-light mx-3 hover:underline">Dashboard</a>
        <a th:href="@{/admin/add-movie}" class="text-light mx-3 hover:underline">Add Movie</a>
        <a th:href="@{/admin/sales-report}" class="text-light mx-3 hover:underline">Sales Report</a>
        <a th:href="@{/aboutus}" class="text-light mx-3 hover:underline">About Us</a>
        <a th:href="@{/contactus}" class="text-light mx-3 hover:underline">Contact Us</a>
        <a th:href="@{/logout}" class="text-light mx-3 hover:underline">Logout</a>
    </nav>

	<main class="container mt-4">
	    <h2>All Registered Customers</h2>
		
	    <table class="table table-striped table-bordered">
	        <thead class="table-dark">
	        <tr>
	            <th>Customer ID</th>
	            <th>Name</th>
	            <th>Email</th>
	        </tr>
	        </thead>
	        <tbody>
	        <tr th:each="cust : ${customers}" th:if="${cust.bid != 1}">
	            <td th:text="${cust.bid}"></td>
	            <td th:text="${cust.name}"></td>
	            <td th:text="${cust.email}"></td>
	        </tr>
	        </tbody>
	    </table>
	</main>

</body>
</html>
