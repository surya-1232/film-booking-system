<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>SunLight PlayHouse - Manage Movies</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}" />
    <link rel="stylesheet" th:href="@{/css/all.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>

<body>
    <!-- Top Branding -->
	<header class="bg-dark text-light p-3">
        <h2 class="text-center text-2xl font-bold">SunLight PlayHouse - Admin Panel</h2>
    </header>

    <!-- Horizontal Navigation -->
	<nav class="bg-secondary p-2 text-center">
		<a th:href="@{/admin/home}" class="text-light mx-3 hover:underline">Dashboard</a>
		<a th:href="@{/admin/add-movie}" class="text-light mx-3 hover:underline">Add Movie</a> 
        <a th:href="@{/admin/customer-details}" class="text-light mx-3 hover:underline">Customer Details</a>
		<a th:href="@{/admin/sales-report}" class="text-light mx-3 hover:underline">Sales Reports</a>
        <a th:href="@{/logout}" class="text-light mx-3 hover:underline">Logout</a>
    </nav>

    <!-- Main Content -->
	<main class="container mt-4">
		<h3 class="mb-3">Manage Movies</h3>
		<p class="text-muted">Here you can update or delete movies easily.</p>

		<!-- Movies Table -->
		<table class="table table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th>Movie Name</th>
					<th>Description</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="movie : ${movies}">
					<td th:text="${movie.movieId}"></td>
					<td th:text="${movie.movieName}"></td>
					<td th:text="${movie.movieDetails}"></td>
					<td>
						<!-- Update button -->
						<a th:href="@{/admin/update-movie/{id}(id=${movie.movieId})}" 
						   class="btn btn-warning btn-sm">Update</a>

						<!-- Delete button (form to avoid accidental GET delete) -->
						<form th:action="@{/admin/delete-movie/{id}(id=${movie.movieId})}" 
						      method="post" style="display:inline;">
							<button type="submit" class="btn btn-danger btn-sm"
							        onclick="return confirm('Are you sure you want to delete this movie?');">
							    Delete
							</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
